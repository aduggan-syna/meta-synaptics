# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes directories containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-synaptics"
BBFILE_PATTERN_meta-synaptics := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-synaptics = "9"

LAYERDEPENDS_meta-synaptics = "core"

LAYERSERIES_COMPAT_meta-synaptics = "scarthgap"

BBFILES_DYNAMIC += " \
    rdk:${LAYERDIR}/dynamic-layers/rdk/recipes-*/*/*.bb \
    rdk:${LAYERDIR}/dynamic-layers/rdk/recipes-*/*/*.bbappend \
    \
    video:${LAYERDIR}/dynamic-layers/rdk-video/recipes-*/*/*.bb \
    video:${LAYERDIR}/dynamic-layers/rdk-video/recipes-*/*/*.bbappend \
    \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/*/*/*.bb \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/*/*/*.bbappend \
    \
    networking-layer:${LAYERDIR}/dynamic-layers/networking-layer/*/*/*.bb \
    networking-layer:${LAYERDIR}/dynamic-layers/networking-layer/*/*/*.bbappend \
    \
    multimedia-layer:${LAYERDIR}/dynamic-layers/multimedia-layer/*/*/*.bb \
    multimedia-layer:${LAYERDIR}/dynamic-layers/multimedia-layer/*/*/*.bbappend \
    \
    qt5-layer:${LAYERDIR}/dynamic-layers/qt5-layer/*/*/*.bb \
    qt5-layer:${LAYERDIR}/dynamic-layers/qt5-layer/*/*/*.bbappend \
    \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/*/*/*.bb \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/*/*/*.bbappend \
    \
    swupdate:${LAYERDIR}/dynamic-layers/swupdate-layer/*/*/*.bb \
    swupdate:${LAYERDIR}/dynamic-layers/swupdate-layer/*/*/*.bbappend \
    \
    chromium-browser-layer:${LAYERDIR}/dynamic-layers/chromium-browser-layer/*/*/*.bb \
    chromium-browser-layer:${LAYERDIR}/dynamic-layers/chromium-browser-layer/*/*/*.bbappend \
    \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/*/*/*.bbappend \
    \
    meta-python:${LAYERDIR}/dynamic-layers/meta-python/*/*/*.bb \
    meta-python:${LAYERDIR}/dynamic-layers/meta-python/*/*/*.bbappend \
	\
    meta-aws:${LAYERDIR}/dynamic-layers/aws-layer/recipes-*/*/*.bb \
    meta-aws:${LAYERDIR}/dynamic-layers/aws-layer/recipes-*/*/*.bbappend \
"

ASTRA_VERSION = "scarthgap_6.12_v2.5.0"
SYNAP_VERSION = "3.0"
PREFERRED_VERSION_meson-native = "1.3.1"
include syna-sources-git.conf

