#@TYPE: Machine
#@NAME: sl2611nand
#@DESCRIPTION: Machine configuration for the SL2611 SoC

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

include conf/machine/include/syna-tiny.inc
include conf/machine/include/syna-sdk.inc

MACHINEOVERRIDES =. "sl2611:klamath:"

IMAGE_CLASSES:remove = "image_synaimg"
IMAGE_CLASSES += "image_synanandimg"
IMAGE_FSTYPES = "synanandimg"

SYNA_SDK_CONFIG_NAME ?= "sl2611_nand_${DISTRO_CONFIG}_aarch64_rdk"
SYNA_SDK_CONFIG_FILE ?= "${SYNA_SDK_CONFIG_NAME}_defconfig"
SYNA_SDK_PT_FILE = "nand.pt"
SYNA_SDK_FLASH_TYPE_CFG_FILE = "flash_type.cfg"
SYNA_SDK_FASTLOGO_IMG = ""
SYNA_KERNEL_CONFIG_FILE ?= "sl261x_defconfig"
SYNA_KERNEL_DTS_FILE ?= "synaptics/sl2611-nand-rdk.dtb"
SYNA_KERNEL_DTBO_FILE ?= "synaptics/sl261x-nand-overlay.dtbo"

# WPE buffer size for media (important for youtube in 4K)
# 30MB for 1GB DRAM systems, 90MB for 2GB DRAM systems
SYNA_MEDIASOURCE_VIDEO_BUFFER_SIZE = "90"
# WPE RAM size limits, 192/200 for 1GB DRAM systems, 320/340 for 2GB DRAM systems
# (important to prevent memory pressure)
SYNA_WPE_RAM_SIZE = "320"
SYNA_WPE_WEB_PROCESS_RAM_SIZE = "340"

PREFERRED_VERSION_linux-syna:sl2611nand = "6.12.62"
PREFERRED_VERSION_linux-firmware-syna:sl2611nand = "6.12.62"

PREFERRED_PROVIDER_u-boot-fw-utils:sl2611nand= "libubootenv"

#Remove packages to reduce rootfs size to fit small disk
IMAGE_FEATURES:remove:sl2611nand = "package-management ssh-server-dropbear"
DISTORO_FEATURES:sl2611nand = "acl alsa debuginfod ext2 ipv4 ipv6 pcmcia usbgadget usbhost wifi xattr nfs zeroconf pci vfat seccomp"
IMAGE_INSTALL:remove:sl2611nand = "gdbserver curl v4l-utils alsa-utils synasdk-syna-settings-framework wget vim wlan-connect ethtool syna-wifi-tools hostapd iptables protobuf libdrm-tests opensc brcm-patchram-plus synasdk-brcm-bt-start libgpiod libgpiod-tools iperf2 iperf3 net-tools tcpdump pciutils iputils zip networkmanager networkmanager-nmcli modemmanager evtest bridge-utils bluealsa" 
