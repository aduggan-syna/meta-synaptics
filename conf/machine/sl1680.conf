#@TYPE: Machine
#@NAME: sl1680
#@DESCRIPTION: Machine configuration for the SL1680 SoC

require conf/machine/include/arm/armv8a/tune-cortexa73.inc

include conf/machine/include/syna.inc
include conf/machine/include/syna-sdk.inc

MACHINEOVERRIDES =. "dolphin:"

SYNA_SDK_CONFIG_NAME ?= "sl1680_${DISTRO_CONFIG}_aarch64_rdk"
SYNA_SDK_CONFIG_FILE ?= "${SYNA_SDK_CONFIG_NAME}_defconfig"
SYNA_KERNEL_CONFIG_FILE ?= "dolphin_defconfig"
SYNA_KERNEL_DTS_FILE ?= "synaptics/dolphin-rdk.dtb"
SYNA_KERNEL_DTBO_FILE ?= "synaptics/dolphin-csi0-with-expander.dtbo \
                          synaptics/dolphin-csi1-without-expander.dtbo \
                          synaptics/dolphin-bothcsi-without-expander.dtbo \
                          synaptics/dolphin-csi0-with-expander-csi1-without-expander.dtbo \
                          synaptics/dolphin-csi0-with-expander-dewarp-imx415.dtbo \
                          synaptics/dolphin-csi0-with-expander-dewarp-imx258.dtbo \
                          synaptics/dolphin-haier-panel-overlay.dtbo \
                          synaptics/dolphin-ws-panel-overlay.dtbo \
                          synaptics/dolphin-ws-1080p-panel-overlay.dtbo \
                          synaptics/dolphin-spi2-overlay.dtbo"

# WPE buffer size for media (important for youtube in 4K)
# 30MB for 1GB DRAM systems, 90MB for 2GB DRAM systems
SYNA_MEDIASOURCE_VIDEO_BUFFER_SIZE = "90"
# WPE RAM size limits, 192/200 for 1GB DRAM systems, 320/340 for 2GB DRAM systems
# (important to prevent memory pressure)
SYNA_WPE_RAM_SIZE = "320"
SYNA_WPE_WEB_PROCESS_RAM_SIZE = "340"

PREFERRED_VERSION_linux-syna:sl1680 = "5.15.140"
PREFERRED_VERSION_linux-firmware-syna:sl1680 = "5.15.140"

PREFERRED_PROVIDER_virtual/bootloader:sl1680 = "syna-u-boot"

PREFERRED_PROVIDER_u-boot-fw-utils:sl1680= "libubootenv"
