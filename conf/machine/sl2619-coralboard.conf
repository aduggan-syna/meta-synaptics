#@TYPE: Machine
#@NAME: sl2619-coralboard
#@DESCRIPTION: Machine configuration for the sl2619 coralboard platform

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

include conf/machine/include/syna-sl261x.inc
include conf/machine/include/syna-sdk.inc

MACHINEOVERRIDES =. "klamath:sl2619:"

SYNA_SDK_CONFIG_NAME ?= "sl2619_${DISTRO_CONFIG}_aarch64_coralboard"
SYNA_SDK_CONFIG_FILE ?= "${SYNA_SDK_CONFIG_NAME}_defconfig"
UBOOT_MACHINE ?= "klamath_suboot_defconfig"
UBOOT_DTS_FILE ?= "klamath-coralboard.dtb"
SYNA_KERNEL_CONFIG_FILE ?= "sl261x_defconfig"
SYNA_KERNEL_DTS_FILE ?= "synaptics/sl2619-coralboard.dtb"
SYNA_KERNEL_DTBO_FILE ?= "synaptics/sl261x-haier-panel-overlay.dtbo \
			  synaptics/sl2619-coralboard-ws-1080p-panel-overlay.dtbo \
			  synaptics/sl2619-coralboard-ws-panel-overlay.dtbo \
			  synaptics/sl2619-coralboard-ws-10p1in-v2-overlay.dtbo\
			  synaptics/sl2619-coralboard-ws-10-1-inch-panel-overlay.dtbo"

# WPE buffer size for media (important for youtube in 4K)
# 30MB for 1GB DRAM systems, 90MB for 2GB DRAM systems
SYNA_MEDIASOURCE_VIDEO_BUFFER_SIZE = "90"
# WPE RAM size limits, 192/200 for 1GB DRAM systems, 320/340 for 2GB DRAM systems
# (important to prevent memory pressure)
SYNA_WPE_RAM_SIZE = "320"
SYNA_WPE_WEB_PROCESS_RAM_SIZE = "340"

PREFERRED_VERSION_linux-syna:sl2619-coralboard = "6.12.62"
PREFERRED_VERSION_linux-firmware-syna:sl2619-coralboard = "6.12.62"

PREFERRED_PROVIDER_u-boot-fw-utils:sl2619-coralboard = "libubootenv"
