#@TYPE: Machine
#@NAME: sl2619xspi
#@DESCRIPTION: Machine configuration for the SL2619 SoC

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

include conf/machine/include/syna-tiny.inc
include conf/machine/include/syna-sdk.inc

IMAGE_CLASSES:remove = "image_synaimg"
IMAGE_CLASSES += "image_synaspiimg"
IMAGE_FSTYPES = "synaspiimg"

MACHINEOVERRIDES =. "klamath:"

SYNA_SDK_CONFIG_NAME ?= "sl2619_xspi_${DISTRO_CONFIG}_aarch64_rdk"
SYNA_SDK_CONFIG_FILE ?= "${SYNA_SDK_CONFIG_NAME}_defconfig"
SYNA_SDK_PT_FILE = "xspi.pt"
SYNA_SDK_FLASH_TYPE_CFG_FILE = ""
SYNA_SDK_FLASH_ATTR = "ISSI-MX-1BIT"
SYNA_SDK_FASTLOGO_IMG = ""
UBOOT_MACHINE ?= "klamath_spi_suboot_defconfig"
UBOOT_DTS_FILE ?= "klamath-rdk.dtb"
SYNA_KERNEL_CONFIG_FILE ?= "sl261x_sizelimit_defconfig"
SYNA_KERNEL_DTS_FILE ?= "synaptics/sl2619-rdk.dtb"

PREFERRED_VERSION_linux-syna:sl2619xspi = "6.12.62"
PREFERRED_VERSION_linux-firmware-syna:sl2619xspi = "6.12.62"

PREFERRED_PROVIDER_u-boot-fw-utils:sl2619xspi = "libubootenv"

BBMULTICONFIG = "initramfscfg"
INITRAMFS_MULTICONFIG = "initramfscfg"
INITRAMFS_DEPLOY_DIR_IMAGE = "${TOPDIR}/tmp-initramfscfg/deploy/images/${MACHINE}"
