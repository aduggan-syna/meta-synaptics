#@TYPE: Machine
#@NAME: sl1620spi
#@DESCRIPTION: Machine configuration for the SL1620 SoC

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

include conf/machine/include/syna-tiny.inc
include conf/machine/include/syna-sdk.inc

IMAGE_CLASSES:remove = "image_synaimg"
IMAGE_CLASSES += "image_synaspiimg"
IMAGE_FSTYPES = "synaspiimg"

MACHINEOVERRIDES =. "myna2:"

SYNA_SDK_CONFIG_NAME ?= "sl1620_spi_${DISTRO_CONFIG}_aarch64_rdk"
SYNA_SDK_CONFIG_FILE ?= "${SYNA_SDK_CONFIG_NAME}_defconfig"
SYNA_SDK_PT_FILE = "spi.pt"
SYNA_SDK_FLASH_TYPE_CFG_FILE = "flash_type.cfg"
SYNA_SDK_FASTLOGO_IMG = ""
SYNA_KERNEL_CONFIG_FILE ?= "myna2_sizelimit_defconfig"
SYNA_KERNEL_DTS_FILE ?= "synaptics/myna2-rdk.dtb"

PREFERRED_VERSION_linux-syna:sl1620spi = "6.12.62"
PREFERRED_VERSION_linux-firmware-syna:sl1620spi = "6.12.62"

PREFERRED_PROVIDER_u-boot-fw-utils:sl1620spi= "libubootenv"

BBMULTICONFIG = "initramfscfg"
INITRAMFS_MULTICONFIG = "initramfscfg"
INITRAMFS_DEPLOY_DIR_IMAGE = "${TOPDIR}/tmp-initramfscfg/deploy/images/${MACHINE}"
