#@TYPE: Machine
#@NAME: sl1640spi
#@DESCRIPTION: Machine configuration for the SL1640 SoC

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

include conf/machine/include/syna-tiny.inc
include conf/machine/include/syna-sdk.inc

IMAGE_CLASSES:remove = "image_synaimg"
IMAGE_CLASSES += "image_synaspiimg"
IMAGE_FSTYPES = "synaspiimg"

MACHINEOVERRIDES =. "platypus:"

SYNA_SDK_CONFIG_NAME ?= "sl1640_spi_${DISTRO_CONFIG}_aarch64_rdk"
SYNA_SDK_CONFIG_FILE ?= "${SYNA_SDK_CONFIG_NAME}_defconfig"
SYNA_SDK_PT_FILE = "spi.pt"
SYNA_SDK_FLASH_TYPE_CFG_FILE = "flash_type.cfg"
SYNA_SDK_FASTLOGO_IMG = ""
SYNA_KERNEL_CONFIG_FILE ?= "platypus_defconfig"
SYNA_KERNEL_DTS_FILE ?= "synaptics/platypus-rdk.dtb"

PREFERRED_VERSION_linux-syna:sl1640spi = "5.15.140"
PREFERRED_VERSION_linux-firmware-syna:sl1640spi = "5.15.140"

PREFERRED_PROVIDER_virtual/bootloader:sl1640spi = "syna-u-boot"

PREFERRED_PROVIDER_u-boot-fw-utils:sl1640spi= "libubootenv"
